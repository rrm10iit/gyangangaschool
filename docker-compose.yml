name: gyanganga

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gyanganga
      POSTGRES_USER: gyanganga
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyanganga -d gyanganga"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gyanganga
      DB_USER: gyanganga
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gyanganga.school}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Gyan Ganga School}
      ENQUIRY_NOTIFY_EMAIL: ${ENQUIRY_NOTIFY_EMAIL:-}
    volumes:
      - uploads:/data
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    networks: [internal]

  # HTTPS reverse proxy: the only service reachable from the internet.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Nightly database dump into ./backups (keeps the last 14 days).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U gyanganga -Fc gyanganga > /backups/db-$$stamp.dump && \
          tar -czf /backups/uploads-$$stamp.tar.gz -C /data . && \
          echo "backup $$stamp done"
          find /backups -type f -mtime +14 -delete
          sleep 86400
        done
    networks: [internal]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
