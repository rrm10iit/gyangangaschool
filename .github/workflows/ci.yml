name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # `verify` runs the fast unit tests, then the integration tests against PostgreSQL in Docker (Testcontainers)
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/target/*-reports

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: Browser tests (full stack in Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ADMIN_PASSWORD: Ci-Admin-Pass-123
    steps:
      - uses: actions/checkout@v4
      - name: Settings for the test stack
        run: |
          cat > .env <<EOF
          DB_PASSWORD=ci-db-password-$(openssl rand -hex 8)
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          COOKIE_SECURE=false
          HTTP_PORT=80
          SEED_DEMO_DATA=true
          ENQUIRY_RATE_LIMIT=1000
          EOF
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run browser tests
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail 200
